name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair projeto
        run: unzip -q BancaManagerPro_Android_CloudBuild.zip -d source

      - name: Compilar aplicativo
        run: gradle -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BancaManagerPro-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
